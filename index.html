<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit Gallery Camera</title>

<style>
*{ box-sizing:border-box; }

html, body{
  margin:0;
  height:100%;
  overflow:hidden; /* 🔥 prevents iPad scroll */
  background:radial-gradient(circle at 30% 20%, #f6f6f2, #e7e7e2);
  font-family:Arial,sans-serif;
}

/* FULL SCREEN LOCKED STAGE */
.stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* WALL ALWAYS FITS SCREEN */
.wall{
  transform-origin:center;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* CONTROLS */
.controls{
  position:fixed;
  top:20px;
  left:20px;
  z-index:10;
  display:flex;
  gap:10px;
  align-items:center;
}

button, select{
  padding:10px 12px;
  border-radius:10px;
  font-size:16px;
  border:none;
}

button{
  cursor:pointer;
}

/* FRAME */
.frame{
  background:#f7f7f4;
  padding:80px;
  border-radius:8px;
  box-shadow:0 60px 160px rgba(0,0,0,.20);
}

/* WINDOW (aspect ratio controlled) */
.window{
  position:relative;
  width:min(900px, 80vw);
  aspect-ratio:3 / 2;
  background:#fff;
  border:18px solid #fdfdfc;
  box-shadow:0 25px 60px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.15);
  overflow:hidden;
}

.window::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:3;
  background:#fff;
  padding:55px;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.06),
    inset 0 18px 50px rgba(0,0,0,.12);
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

/* hidden camera */
video{
  position:fixed;
  top:0;
  left:0;
  width:2px;
  height:2px;
  opacity:0.001;
}
</style>
</head>

<body>

<div class="controls">
  <button id="toggle">Pause</button>

  <select id="aspectSelect">
    <option value="3/2">3:2 (DSLR / Photo)</option>
    <option value="2/3">2:3 (Portrait Photo)</option>
    <option value="4/3">4:3 (Classic)</option>
    <option value="16/9">16:9 (Widescreen)</option>
    <option value="1/1">1:1 (Square)</option>
    <option value="3/4">3:4 (Portrait crop)</option>
    <option value="9/16">9:16 (Phone story)</option>
  </select>
</div>

<div class="stage">
  <div class="wall" id="wall">
    <div class="frame">
      <div class="window">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>

<script>
const wall = document.getElementById("wall");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const windowEl = document.querySelector(".window");
const aspectSelect = document.getElementById("aspectSelect");
const toggleBtn = document.getElementById("toggle");

let running = true;
let stream = null;

/* ---------------- LOCK WALL TO SCREEN ---------------- */
function fitWall(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const frame = 1200;
  const scale = Math.min(vw / frame, vh / frame);

  wall.style.transform = `scale(${scale})`;
}
window.addEventListener("resize", fitWall);
fitWall();

/* ---------------- ASPECT RATIO ---------------- */
aspectSelect.addEventListener("change", (e)=>{
  windowEl.style.aspectRatio = e.target.value;
  resize();
});

/* ---------------- CAMERA ---------------- */
async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" },
    audio:false
  });

  video.srcObject = stream;
  await video.play();

  resize();
  requestAnimationFrame(draw);
}
startCamera();

/* ---------------- CANVAS ---------------- */
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resize);

/* ---------------- DRAW LOOP ---------------- */
function draw(){
  requestAnimationFrame(draw);
  if(!running) return;
  if(video.readyState < 2) return;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
}

/* ---------------- PAUSE / PLAY ---------------- */
toggleBtn.addEventListener("click", ()=>{
  running = !running;

  if(running){
    toggleBtn.textContent = "Pause";
    requestAnimationFrame(draw);
  }else{
    toggleBtn.textContent = "Play";
    // freeze frame (no clearing, last canvas stays visible)
  }
});
</script>

</body>
</html>
