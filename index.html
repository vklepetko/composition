<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<!-- IMPORTANT: disables browser zoom on iPad -->
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
/>

<title>Gallery Camera</title>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;

  background:radial-gradient(circle at 30% 20%, #f6f6f2, #e7e7e2);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;

  font-family:Arial,sans-serif;
  padding:30px;
}

/* controls */
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button, select{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

/* wall frame */
.frame{
  position:relative;
  padding:110px;

  background:rgba(255,255,255,0.25);
  border-radius:10px;

  box-shadow:inset 0 0 80px rgba(0,0,0,.08);
}

/* physical frame */
.window{
  position:relative;
  width:min(90vw,900px);
  aspect-ratio:4 / 3;

  overflow:hidden;
  background:#fff;

  border:18px solid #fdfdfc;

  box-shadow:
    0 25px 60px rgba(0,0,0,.25),
    0 6px 18px rgba(0,0,0,.15);

  touch-action:none;
}

/* MAT */
.window::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:3;

  background:#fff;
  padding:55px;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.06),
    inset 0 18px 50px rgba(0,0,0,.12);
}

/* canvas */
canvas{
  width:100%;
  height:100%;
  display:block;
  background:#fff;

  position:relative;
  z-index:1;

  /* CRITICAL for iPad */
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

/* hidden camera */
video{
  position:fixed;
  top:0;
  left:0;
  width:2px;
  height:2px;
  opacity:0.001;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="controls">
  <select id="ratio">
    <option value="auto">Auto</option>
    <option value="4 / 3">4:3</option>
    <option value="1 / 1">1:1</option>
    <option value="16 / 9">16:9</option>
    <option value="9 / 16">9:16</option>
    <option value="2 / 3">2:3</option>
  </select>

  <button id="snap">Take Photo</button>
</div>

<div class="frame">
  <div class="window" id="window">
    <canvas id="canvas"></canvas>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const windowEl = document.getElementById("window");

let ready = false;
let scale = 1;
let offsetX = 0;
let offsetY = 0;

/* resize */
function resizeCanvas(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resizeCanvas);

/* AUTO orientation */
function updateOrientation(){
  const isPortrait = window.innerHeight > window.innerWidth;

  if(document.getElementById("ratio").value === "auto"){
    windowEl.style.aspectRatio = isPortrait ? "2 / 3" : "4 / 3";
    setTimeout(resizeCanvas, 50);
  }
}

window.addEventListener("resize", updateOrientation);
window.addEventListener("orientationchange", updateOrientation);

/* camera */
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ ideal:"environment" } }
    });

    video.srcObject = stream;

    await new Promise(r => video.onloadedmetadata = r);
    await video.play();

    await new Promise(r => setTimeout(r, 200));

    resizeCanvas();
    updateOrientation();

    ready = true;
    requestAnimationFrame(draw);

  }catch(err){
    alert("Camera failed. Use HTTPS and allow permissions.");
  }
}
startCamera();

/* draw */
function draw(){
  requestAnimationFrame(draw);

  if(!ready) return;
  if(video.readyState < 2) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if(!vw || !vh) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const drawW = vw * scale;
  const drawH = vh * scale;

  const x = (canvas.width - drawW)/2 + offsetX;
  const y = (canvas.height - drawH)/2 + offsetY;

  ctx.drawImage(video, x, y, drawW, drawH);
}

/* drag */
let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", e=>{
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("pointerup", ()=>{
  dragging = false;
});

window.addEventListener("pointermove", e=>{
  if(!dragging) return;

  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* iPad-safe PINCH ZOOM (FIXED) */
let lastDist = null;
let initialScale = 1;

function getDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

canvas.addEventListener("touchstart", e=>{
  if(e.touches.length === 2){
    e.preventDefault();
    lastDist = getDist(e.touches);
    initialScale = scale;
  }
},{ passive:false });

canvas.addEventListener("touchmove", e=>{
  if(e.touches.length !== 2) return;

  e.preventDefault(); // STOP page zoom

  const dist = getDist(e.touches);

  if(lastDist){
    const factor = dist / lastDist;
    scale = Math.max(1, Math.min(5, initialScale * factor));
  }
},{ passive:false });

canvas.addEventListener("touchend", ()=>{
  lastDist = null;
});

/* mouse wheel zoom */
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.max(1, Math.min(5, scale));
},{ passive:false });

/* aspect ratio */
document.getElementById("ratio")
.addEventListener("change", e=>{
  if(e.target.value === "auto"){
    updateOrientation();
  }else{
    windowEl.style.aspectRatio = e.target.value;
    setTimeout(resizeCanvas, 50);
  }
});

/* snapshot */
document.getElementById("snap")
.addEventListener("click", ()=>{
  const a = document.createElement("a");
  a.download = "gallery-photo.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});
</script>

</body>
</html>
