<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit Gallery Camera</title>

<style>
*{ box-sizing:border-box; }

html, body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at 30% 20%, #f6f6f2, #e7e7e2);
  font-family:Arial,sans-serif;
}

.stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.wall{
  transform-origin:center;
}

.controls{
  position:fixed;
  top:20px;
  left:20px;
  z-index:10;
  display:flex;
  gap:10px;
  align-items:center;
}

button, select{
  padding:10px 12px;
  border-radius:10px;
  font-size:16px;
  border:none;
}

button{ cursor:pointer; }

.frame{
  background:#f7f7f4;
  padding:80px;
  border-radius:8px;
  box-shadow:0 60px 160px rgba(0,0,0,.20);
}

.window{
  width:min(900px, 80vw);
  aspect-ratio:3 / 2;
  background:#fff;
  border:18px solid #fdfdfc;
  box-shadow:0 25px 60px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.15);
  overflow:hidden;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

video{
  position:fixed;
  top:0;
  left:0;
  width:2px;
  height:2px;
  opacity:0.001;
}
</style>
</head>

<body>

<div class="controls">
  <button id="toggle">Pause</button>

  <select id="aspectSelect">
    <option value="3/2">3:2</option>
    <option value="2/3">2:3</option>
    <option value="4/3">4:3</option>
    <option value="16/9">16:9</option>
    <option value="1/1">1:1</option>
    <option value="3/4">3:4</option>
    <option value="9/16">9:16</option>
  </select>
</div>

<div class="stage">
  <div class="wall" id="wall">
    <div class="frame">
      <div class="window">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>

<script>
const wall = document.getElementById("wall");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const windowEl = document.querySelector(".window");

let running = true;
let stream = null;

/* ---------------- WALL FIT ---------------- */
function fitWall(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const base = 1200;
  const s = Math.min(vw / base, vh / base);

  wall.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitWall);
fitWall();

/* ---------------- ASPECT RATIO ---------------- */
document.getElementById("aspectSelect").addEventListener("change",(e)=>{
  windowEl.style.aspectRatio = e.target.value;
  resize();
});

/* ---------------- CAMERA ---------------- */
async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" },
    audio:false
  });

  video.srcObject = stream;
  await video.play();

  resize();
  requestAnimationFrame(draw);
}
startCamera();

/* ---------------- RESIZE ---------------- */
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resize);

/* ---------------- COVER DRAW (NO SQUISH) ---------------- */
function drawCover(){
  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const cw = canvas.width;
  const ch = canvas.height;

  const videoRatio = vw / vh;
  const canvasRatio = cw / ch;

  let sx, sy, sw, sh;

  if(videoRatio > canvasRatio){
    // video is wider → crop sides
    sh = vh;
    sw = vh * canvasRatio;
    sx = (vw - sw) / 2;
    sy = 0;
  } else {
    // video is taller → crop top/bottom
    sw = vw;
    sh = vw / canvasRatio;
    sx = 0;
    sy = (vh - sh) / 2;
  }

  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
}

/* ---------------- LOOP ---------------- */
function draw(){
  requestAnimationFrame(draw);
  if(!running) return;
  if(video.readyState < 2) return;

  drawCover();
}

/* ---------------- PAUSE / PLAY ---------------- */
document.getElementById("toggle").addEventListener("click", ()=>{
  running = !running;
  document.getElementById("toggle").textContent = running ? "Pause" : "Play";
  if(running) requestAnimationFrame(draw);
});
</script>

</body>
</html>
