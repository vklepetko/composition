<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Camera Viewer</title>

<style>
*{ box-sizing:border-box; }

html, body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at 30% 20%, #f6f6f2, #e7e7e2);
  font-family:Arial,sans-serif;
}

/* FULL SCREEN SAFE STAGE */
.stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SCALE WALL TO FIT SCREEN */
.wall{
  transform-origin:center;
}

/* CONTROLS */
.controls{
  position:fixed;
  top:20px;
  left:20px;
  z-index:20;
  display:flex;
  gap:10px;
  align-items:center;
}

button, select{
  padding:10px 12px;
  border-radius:10px;
  font-size:16px;
  border:none;
}

/* FRAME CONTAINER FIX (IMPORTANT FOR 2:3 BUG) */
.frame{
  background:#f7f7f4;
  padding:60px;

  /* 🔥 CRITICAL: prevents tall ratios escaping screen */
  max-height:90vh;
  max-width:90vw;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;
  box-shadow:0 60px 160px rgba(0,0,0,.20);
}

/* WINDOW */
.window{
  width:min(900px, 80vw, 80vh);
  aspect-ratio:3 / 2;
  background:#fff;
  border:18px solid #fdfdfc;
  box-shadow:0 25px 60px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.15);
  overflow:hidden;
}

/* CANVAS LOCK */
canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* hidden video */
video{
  position:fixed;
  top:0;
  left:0;
  width:2px;
  height:2px;
  opacity:0.001;
}
</style>
</head>

<body>

<div class="controls">
  <button id="toggle">Pause</button>

  <select id="aspectSelect">
    <option value="3/2">3:2</option>
    <option value="2/3">2:3 (Portrait)</option>
    <option value="4/3">4:3</option>
    <option value="16/9">16:9</option>
    <option value="1/1">1:1</option>
    <option value="3/4">3:4</option>
    <option value="9/16">9:16</option>
  </select>
</div>

<div class="stage">
  <div class="wall" id="wall">
    <div class="frame">
      <div class="window">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>

<script>
const wall = document.getElementById("wall");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const windowEl = document.querySelector(".window");

let running = true;

/* ---------------- FIT WALL ---------------- */
function fitWall(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const base = 1200;
  const s = Math.min(vw / base, vh / base);

  wall.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitWall);
fitWall();

/* ---------------- ASPECT ---------------- */
document.getElementById("aspectSelect").addEventListener("change",(e)=>{
  windowEl.style.aspectRatio = e.target.value;
  resize();
  fitWall(); // important so tall ratios re-center properly
});

/* ---------------- CAMERA ---------------- */
async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" },
    audio:false
  });

  video.srcObject = stream;
  await video.play();

  resize();
  requestAnimationFrame(draw);
}
startCamera();

/* ---------------- RESIZE ---------------- */
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resize);

/* ---------------- COVER DRAW (NO SQUISH) ---------------- */
function drawCover(){
  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const cw = canvas.width;
  const ch = canvas.height;

  const vr = vw / vh;
  const cr = cw / ch;

  let sx, sy, sw, sh;

  if(vr > cr){
    sh = vh;
    sw = vh * cr;
    sx = (vw - sw) / 2;
    sy = 0;
  } else {
    sw = vw;
    sh = vw / cr;
    sx = 0;
    sy = (vh - sh) / 2;
  }

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
  ctx.restore();
}

/* ---------------- LOOP ---------------- */
function draw(){
  requestAnimationFrame(draw);
  if(!running) return;
  if(video.readyState < 2) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawCover();
}

/* ---------------- PAUSE ---------------- */
document.getElementById("toggle").addEventListener("click",()=>{
  running = !running;
  document.getElementById("toggle").textContent = running ? "Pause" : "Play";
  if(running) requestAnimationFrame(draw);
});

/* ---------------- ZOOM + PAN ---------------- */
let scale = 1;
let offsetX = 0;
let offsetY = 0;

let pointers = new Map();
let dragging = false;
let lastX = 0;
let lastY = 0;
let startDist = 0;
let startScale = 1;

function dist(a,b){
  return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
}

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);

  if(pointers.size === 1){
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  }

  if(pointers.size === 2){
    const pts = [...pointers.values()];
    startDist = dist(pts[0], pts[1]);
    startScale = scale;
    dragging = false;
  }
});

canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);

  // pinch zoom
  if(pointers.size === 2){
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);

    scale = startScale * (d / startDist);
    scale = Math.max(1, Math.min(5, scale));
    return;
  }

  // drag
  if(dragging){
    offsetX += e.clientX - lastX;
    offsetY += e.clientY - lastY;

    lastX = e.clientX;
    lastY = e.clientY;
  }
});

canvas.addEventListener("pointerup", end);
canvas.addEventListener("pointercancel", end);

function end(e){
  pointers.delete(e.pointerId);
  if(pointers.size === 0) dragging = false;
}

/* ---------------- DESKTOP SCROLL ZOOM ---------------- */
canvas.addEventListener("wheel", (e)=>{
  e.preventDefault();

  const zoomSpeed = 0.0015;
  const delta = -e.deltaY * zoomSpeed;

  const newScale = scale + delta;
  scale = Math.max(1, Math.min(5, newScale));
}, { passive:false });

</script>

</body>
</html>
