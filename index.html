<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Auto Gallery Camera</title>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  background:#eeeeeb;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;

  font-family:Arial,sans-serif;
  padding:20px;
}

/* controls */
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button, select{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

/* gallery wall */
.frame{
  background:#f7f7f4;
  padding:100px;
  box-shadow:0 60px 160px rgba(0,0,0,.20);
  border-radius:8px;
}

/* ART FRAME */
.window{
  position:relative;
  width:min(90vw,900px);
  aspect-ratio:4 / 3; /* default */

  overflow:hidden;
  background:#fff;

  box-shadow:0 30px 90px rgba(0,0,0,.18);

  touch-action:none;
}

/* museum mat */
.window::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:3;

  background:#fff;

  padding:60px;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.06),
    inset 0 20px 60px rgba(0,0,0,.10);
}

/* artwork */
canvas{
  width:100%;
  height:100%;
  display:block;
  background:#fff;
  position:relative;
  z-index:1;
}

/* hidden camera */
video{
  position:fixed;
  top:0;
  left:0;
  width:2px;
  height:2px;
  opacity:0.001;
  pointer-events:none;
  z-index:-1;
}
</style>
</head>

<body>

<div class="controls">
  <select id="ratio">
    <option value="auto">Auto (Device)</option>
    <option value="4 / 3">4:3</option>
    <option value="1 / 1">1:1</option>
    <option value="16 / 9">16:9</option>
    <option value="9 / 16">9:16</option>
    <option value="2 / 3">2:3</option>
  </select>

  <button id="snap">Take Photo</button>
</div>

<div class="frame">
  <div class="window" id="window">
    <canvas id="canvas"></canvas>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const windowEl = document.getElementById("window");
const ratioSelect = document.getElementById("ratio");

let ready = false;
let scale = 1;
let offsetX = 0;
let offsetY = 0;

/* resize */
function resizeCanvas(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resizeCanvas);

/* AUTO ORIENTATION LOGIC */
function updateOrientation(){

  const isPortrait = window.innerHeight > window.innerWidth;

  if(ratioSelect.value === "auto"){

    if(isPortrait){
      windowEl.style.aspectRatio = "2 / 3";
    }else{
      windowEl.style.aspectRatio = "4 / 3";
    }

    setTimeout(resizeCanvas, 50);
  }
}

/* listen for rotation */
window.addEventListener("resize", updateOrientation);
window.addEventListener("orientationchange", updateOrientation);

/* manual override */
ratioSelect.addEventListener("change", e=>{
  if(e.target.value === "auto"){
    updateOrientation();
  }else{
    windowEl.style.aspectRatio = e.target.value;
    setTimeout(resizeCanvas, 50);
  }
});

/* camera */
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ ideal:"environment" } }
    });

    video.srcObject = stream;

    await new Promise(r => video.onloadedmetadata = r);
    await video.play();

    await new Promise(r => setTimeout(r, 200));

    resizeCanvas();
    updateOrientation();

    ready = true;
    requestAnimationFrame(draw);

  }catch(err){
    console.error(err);
    alert("Camera failed. Use HTTPS and allow permissions.");
  }
}
startCamera();

/* draw */
function draw(){
  requestAnimationFrame(draw);

  if(!ready) return;
  if(video.readyState < 2) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if(!vw || !vh) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const drawW = vw * scale;
  const drawH = vh * scale;

  const x = (canvas.width - drawW)/2 + offsetX;
  const y = (canvas.height - drawH)/2 + offsetY;

  ctx.drawImage(video, x, y, drawW, drawH);
}

/* drag */
let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", e=>{
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("pointerup", ()=>{
  dragging = false;
});

window.addEventListener("pointermove", e=>{
  if(!dragging) return;

  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* zoom */
canvas.addEventListener("wheel", e=>{
  e.preventDefault();

  scale += e.deltaY * -0.001;
  scale = Math.max(1, Math.min(5, scale));
},{ passive:false });

/* snapshot */
document.getElementById("snap")
.addEventListener("click", ()=>{
  const a = document.createElement("a");
  a.download = "gallery-photo.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});
</script>

</body>
</html>
