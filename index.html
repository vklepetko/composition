<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Composition Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  /* soft gallery wall */
  background:#efefec;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;

  font-family:Arial,sans-serif;
  color:white;
  padding:20px;
}

/* controls stay minimal */
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button,
select{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

button{
  cursor:pointer;
}

/* OUTER GALLERY SPACE */
.frame{
  background:#f6f6f3;
  padding:90px;                 /* BIG gallery breathing space */
  box-shadow:0 50px 140px rgba(0,0,0,.22);
  border-radius:6px;
}

/* MUSEUM MAT / ART WINDOW */
.window{
  position:relative;
  width:min(90vw,900px);
  aspect-ratio:4/3;
  overflow:hidden;

  /* pure museum white mat */
  background:#ffffff;

  /* very thick fine art border */
  border:48px solid #ffffff;

  /* subtle realism */
  box-shadow:
    0 18px 55px rgba(0,0,0,.18),
    inset 0 0 0 1px rgba(0,0,0,.05);

  touch-action:none;
}

/* floating artwork depth layer */
.window::before{
  content:"";
  position:absolute;
  inset:48px;

  box-shadow:
    0 0 0 1px rgba(0,0,0,.04),
    0 20px 60px rgba(0,0,0,.12);

  pointer-events:none;
}

/* canvas = artwork surface */
canvas{
  width:100%;
  height:100%;
  display:block;
  background:#fff;
  touch-action:none;
}

/* Safari camera fix (unchanged) */
video{
  position:fixed;
  top:0;
  left:0;

  width:2px;
  height:2px;
  opacity:0.001;

  pointer-events:none;
  z-index:-1;
}
</style>
</head>

<body>

<div class="controls">

  <select id="ratio">
    <option value="4 / 3">4:3</option>
    <option value="1 / 1">1:1</option>
    <option value="16 / 9">16:9</option>
    <option value="9 / 16">9:16</option>
  </select>

  <button id="snap">Take Photo</button>

</div>

<div class="frame">

  <div class="window" id="window">
    <canvas id="canvas"></canvas>
  </div>

</div>

<video
  id="video"
  autoplay
  muted
  playsinline
  webkit-playsinline
></video>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const windowEl = document.getElementById("window");

let ready = false;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

/* resize */
function resizeCanvas(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}

window.addEventListener("resize", resizeCanvas);

/* camera */
async function startCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{ ideal:"environment" }
        }
      });

    video.srcObject = stream;

    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
    });

    await video.play();

    await new Promise(resolve =>
      setTimeout(resolve, 200)
    );

    resizeCanvas();

    ready = true;

    requestAnimationFrame(draw);

  }catch(err){
    console.error(err);
    alert("Camera failed. Use HTTPS and allow permissions.");
  }
}

startCamera();

/* draw loop */
function draw(){

  requestAnimationFrame(draw);

  if(!ready) return;
  if(video.readyState < 2) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if(!vw || !vh) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const drawW = vw * scale;
  const drawH = vh * scale;

  const x = (canvas.width - drawW) / 2 + offsetX;
  const y = (canvas.height - drawH) / 2 + offsetY;

  ctx.drawImage(video, x, y, drawW, drawH);
}

/* drag */
let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("pointerup", () => {
  dragging = false;
});

window.addEventListener("pointermove", e => {
  if(!dragging) return;

  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* zoom */
canvas.addEventListener("wheel", e => {
  e.preventDefault();

  scale += e.deltaY * -0.001;

  scale = Math.max(1, Math.min(5, scale));
},{ passive:false });

/* pinch */
let lastDist = null;

canvas.addEventListener("touchstart", e => {
  if(e.touches.length === 2){
    lastDist = getDist(e.touches);
  }
},{ passive:false });

canvas.addEventListener("touchmove", e => {
  if(e.touches.length !== 2) return;

  e.preventDefault();

  const dist = getDist(e.touches);

  if(lastDist){
    scale *= dist / lastDist;
    scale = Math.max(1, Math.min(5, scale));
  }

  lastDist = dist;
},{ passive:false });

canvas.addEventListener("touchend", () => {
  lastDist = null;
});

function getDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

/* aspect ratio */
document.getElementById("ratio")
.addEventListener("change", e => {
  windowEl.style.aspectRatio = e.target.value;
  setTimeout(resizeCanvas, 50);
});

/* snapshot */
document.getElementById("snap")
.addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "composition.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});
</script>

</body>
</html>
