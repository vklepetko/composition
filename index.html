<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Composition Camera</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;

    background: radial-gradient(circle at top, #3a3835 0%, #1f1d1b 70%);
    font-family: Arial, sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 20px;
    gap: 16px;

    color: white;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;

    background: rgba(255,255,255,0.08);
    padding: 10px 14px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
  }

  select, button {
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
  }

  button {
    background: white;
    font-weight: 600;
    cursor: pointer;
  }

  /* THICK MUSEUM FRAME */
  .frame {
    background: #f8f8f5;

    padding:
      clamp(90px, 12vw, 180px)
      clamp(110px, 14vw, 220px)
      clamp(180px, 20vw, 300px)
      clamp(110px, 14vw, 220px);

    border: 2px solid #ece7dc;

    box-shadow:
      0 2px 2px rgba(255,255,255,0.85) inset,
      0 0 0 18px #d9d3c8,
      0 0 0 28px #bdb6aa,
      0 0 0 38px #8f887c,
      0 50px 140px rgba(0,0,0,0.7);
  }

  .window {
    position: relative;

    width: min(80vw, 900px);
    aspect-ratio: 4 / 3;

    overflow: hidden;
    background: black;

    touch-action: none;

    box-shadow: inset 0 0 35px rgba(0,0,0,0.75);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .line {
    position: absolute;
    background: rgba(255,255,255,0.3);
  }

  .v1 { left: 33.33%; width: 1px; height: 100%; }
  .v2 { left: 66.66%; width: 1px; height: 100%; }
  .h1 { top: 33.33%; height: 1px; width: 100%; }
  .h2 { top: 66.66%; height: 1px; width: 100%; }

</style>
</head>

<body>

<div class="controls">
  <label>Ratio</label>

  <select id="ratio">
    <option value="4/3" selected>4:3</option>
    <option value="1/1">1:1</option>
    <option value="3/2">3:2</option>
    <option value="16/9">16:9</option>
    <option value="9/16">9:16</option>
    <option value="5/4">5:4</option>
  </select>

  <button id="snap">Take Photo</button>
</div>

<div class="frame">
  <div class="window" id="window">

    <canvas id="canvas"></canvas>

    <div class="grid">
      <div class="line v1"></div>
      <div class="line v2"></div>
      <div class="line h1"></div>
      <div class="line h2"></div>
    </div>

  </div>
</div>

<video id="video" autoplay playsinline muted style="display:none;"></video>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

/* state */
let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let lastX = 0;
let lastY = 0;

/* camera */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;

    await video.play(); // IMPORTANT for Safari

    video.onloadedmetadata = () => {
      requestAnimationFrame(draw);
    };

  } catch (err) {
    console.error(err);
    alert("Camera access failed");
  }
}

startCamera();

/* DRAW LOOP (Safari-safe + crop zoom, no stretching) */
function draw() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if (!vw || !vh) {
    requestAnimationFrame(draw);
    return;
  }

  canvas.width = vw;
  canvas.height = vh;

  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, vw, vh);

  /* "cover" style transform (crop, NOT stretch) */
  const drawW = vw * scale;
  const drawH = vh * scale;

  const x = (vw - drawW) / 2 + offsetX;
  const y = (vh - drawH) / 2 + offsetY;

  ctx.drawImage(video, x, y, drawW, drawH);

  requestAnimationFrame(draw);
}

/* mouse drag */
canvas.addEventListener("mousedown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", e => {
  if (!dragging) return;

  offsetX += (e.clientX - lastX) * -1;
  offsetY += (e.clientY - lastY) * -1;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* zoom (mouse wheel) */
canvas.addEventListener("wheel", e => {
  e.preventDefault();

  scale += e.deltaY * -0.0015;
  scale = Math.min(Math.max(1, 5), scale);
}, { passive: false });

/* pinch zoom */
let lastDist = null;

canvas.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    lastDist = dist(e.touches);
  }
});

canvas.addEventListener("touchmove", e => {
  if (e.touches.length === 2) {
    e.preventDefault();

    const d = dist(e.touches);

    if (lastDist) {
      scale *= d / lastDist;
      scale = Math.min(Math.max(1, 5), scale);
    }

    lastDist = d;
  }
}, { passive: false });

function dist(t) {
  const dx = t[0].clientX - t[1].clientX;
  const dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

/* aspect ratio (viewfinder crop only) */
document.getElementById("ratio").addEventListener("change", e => {
  const v = e.target.value;
  canvas.parentElement.style.aspectRatio = v;
});

/* capture EXACT frame */
document.getElementById("snap").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "composition.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});
</script>

</body>
</html>
