<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Composition Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#1f1d1b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  font-family:Arial,sans-serif;
  color:white;
  padding:20px;
}

.controls{
  display:flex;
  gap:10px;
}

.frame{
  background:#f8f8f5;
  padding:60px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.window{
  position:relative;
  width:min(90vw,900px);
  aspect-ratio:4/3;
  overflow:hidden;
  background:black;
  touch-action:none;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

/* IMPORTANT:
   Safari camera bug fix:
   keep video in DOM and renderable
*/
video{
  position:absolute;
  left:-9999px;
  top:-9999px;
  width:1px;
  height:1px;
  opacity:0.01;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="controls">
  <select id="ratio">
    <option value="4/3">4:3</option>
    <option value="1/1">1:1</option>
    <option value="16/9">16:9</option>
    <option value="9/16">9:16</option>
  </select>

  <button id="snap">Take Photo</button>
</div>

<div class="frame">
  <div class="window" id="window">
    <canvas id="canvas"></canvas>
  </div>
</div>

<video
  id="video"
  autoplay
  muted
  playsinline
  webkit-playsinline
></video>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let ready = false;

/* ---------- CAMERA ---------- */

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{
          ideal:"environment"
        }
      }
    });

    video.srcObject = stream;

    // REQUIRED for Safari
    await video.play();

    // Safari reliability
    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
    });

    // set canvas ONCE
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ready = true;

    requestAnimationFrame(draw);

  } catch(err) {

    console.error(err);

    alert(
      "Camera failed.\n\n" +
      "Use HTTPS and allow camera permissions."
    );
  }
}

startCamera();

/* ---------- DRAW ---------- */

function draw() {

  if (!ready) {
    requestAnimationFrame(draw);
    return;
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if (!vw || !vh) {
    requestAnimationFrame(draw);
    return;
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const drawW = vw * scale;
  const drawH = vh * scale;

  const x = (canvas.width - drawW)/2 + offsetX;
  const y = (canvas.height - drawH)/2 + offsetY;

  ctx.drawImage(video, x, y, drawW, drawH);

  requestAnimationFrame(draw);
}

/* ---------- DRAG ---------- */

let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("pointerup", () => {
  dragging = false;
});

window.addEventListener("pointermove", e => {

  if (!dragging) return;

  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* ---------- WHEEL ZOOM ---------- */

canvas.addEventListener("wheel", e => {

  e.preventDefault();

  scale += e.deltaY * -0.001;

  scale = Math.max(1, Math.min(5, scale));

}, { passive:false });

/* ---------- PINCH ---------- */

let lastDist = null;

canvas.addEventListener("touchstart", e => {

  if (e.touches.length === 2) {
    lastDist = getDist(e.touches);
  }

}, { passive:false });

canvas.addEventListener("touchmove", e => {

  if (e.touches.length !== 2) return;

  e.preventDefault();

  const d = getDist(e.touches);

  if (lastDist) {
    scale *= d / lastDist;
    scale = Math.max(1, Math.min(5, scale));
  }

  lastDist = d;

}, { passive:false });

function getDist(touches){

  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;

  return Math.sqrt(dx*dx + dy*dy);
}

/* ---------- RATIO ---------- */

document.getElementById("ratio").addEventListener("change", e => {
  document.getElementById("window").style.aspectRatio = e.target.value;
});

/* ---------- SNAPSHOT ---------- */

document.getElementById("snap").addEventListener("click", () => {

  const a = document.createElement("a");

  a.download = "composition.png";
  a.href = canvas.toDataURL("image/png");

  a.click();
});
</script>

</body>
</html>
