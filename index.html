<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fit Gallery Upload</title>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 30% 20%, #f6f6f2, #e7e7e2);
  font-family:Arial,sans-serif;
}

.stage{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.wall{
  transform-origin:center;
}

.controls{
  position:fixed;
  top:20px;
  left:20px;
  display:flex;
  gap:10px;
  z-index:10;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

input[type="file"]{
  display:none;
}

.frame{
  background:#f7f7f4;
  padding:100px;
  border-radius:8px;
  box-shadow:0 60px 160px rgba(0,0,0,.20);
}

.window{
  position:relative;
  width:900px;
  aspect-ratio:4 / 3;
  background:#fff;
  border:18px solid #fdfdfc;
  box-shadow:0 25px 60px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.15);
  overflow:hidden;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}
</style>
</head>

<body>

<div class="controls">
  <label>
    <button>Upload Photo</button>
    <input id="upload" type="file" accept="image/*">
  </label>

  <button id="snap">Export</button>
</div>

<div class="stage" id="stage">
  <div class="wall" id="wall">
    <div class="frame">
      <div class="window">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const wall = document.getElementById("wall");
const upload = document.getElementById("upload");

let img = new Image();
let imgLoaded = false;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

/* ---------------- WALL FIT ---------------- */
function fitWall(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const baseWidth = 1200;
  const baseHeight = 900;

  const s = Math.min(vw / baseWidth, vh / baseHeight) * 0.95;
  wall.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitWall);
fitWall();

/* ---------------- CANVAS SIZE ---------------- */
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  draw();
}
window.addEventListener("resize", resize);
resize();

/* ---------------- IMAGE UPLOAD ---------------- */
upload.addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = (evt)=>{
    img = new Image();
    img.onload = ()=>{
      imgLoaded = true;
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      draw();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
});

/* ---------------- DRAW IMAGE ---------------- */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!imgLoaded) return;

  const w = img.width * scale;
  const h = img.height * scale;

  const x = (canvas.width - w)/2 + offsetX;
  const y = (canvas.height - h)/2 + offsetY;

  ctx.drawImage(img, x, y, w, h);
  requestAnimationFrame(draw);
}
draw();

/* ---------------- DRAG + PINCH ---------------- */
let pointers = new Map();
let dragging = false;
let lx = 0, ly = 0;
let startDist = 0;
let startScale = 1;

function dist(a,b){
  return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
}

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);

  if(pointers.size === 1){
    dragging = true;
    lx = e.clientX;
    ly = e.clientY;
  }

  if(pointers.size === 2){
    const pts = [...pointers.values()];
    startDist = dist(pts[0], pts[1]);
    startScale = scale;
    dragging = false;
  }
});

canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);

  if(pointers.size === 2){
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);

    scale = startScale * (d / startDist);
    scale = Math.max(0.2, Math.min(5, scale));
    return;
  }

  if(!dragging) return;

  offsetX += e.clientX - lx;
  offsetY += e.clientY - ly;

  lx = e.clientX;
  ly = e.clientY;
});

function endPointer(e){
  pointers.delete(e.pointerId);
  dragging = false;
}

canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

/* ---------------- EXPORT (FRAME + WALL + IMAGE) ---------------- */
document.getElementById("snap").onclick = ()=>{

  const stage = document.getElementById("stage");
  const rect = stage.getBoundingClientRect();

  const exportCanvas = document.createElement("canvas");
  const ex = exportCanvas.getContext("2d");

  const scaleFactor = 2;

  exportCanvas.width = rect.width * scaleFactor;
  exportCanvas.height = rect.height * scaleFactor;

  ex.scale(scaleFactor, scaleFactor);

  // background (wall)
  const gradient = ex.createRadialGradient(
    rect.width * 0.3, rect.height * 0.2, 100,
    rect.width * 0.5, rect.height * 0.5, rect.width
  );

  gradient.addColorStop(0, "#f6f6f2");
  gradient.addColorStop(1, "#e7e7e2");

  ex.fillStyle = gradient;
  ex.fillRect(0,0,rect.width,rect.height);

  // window placement
  const windowEl = document.querySelector(".window");
  const winRect = windowEl.getBoundingClientRect();

  const offsetX = (rect.width - winRect.width)/2;
  const offsetY = (rect.height - winRect.height)/2;

  ex.save();
  ex.translate(offsetX, offsetY);

  // frame
  ex.fillStyle = "#f7f7f4";
  roundRect(ex, -100, -100, winRect.width + 200, winRect.height + 200, 8);
  ex.fill();

  // window
  ex.fillStyle = "#fff";
  ex.fillRect(0,0,winRect.width,winRect.height);

  // image from canvas
  const sourceCanvas = document.getElementById("canvas");
  ex.drawImage(sourceCanvas, 0, 0, winRect.width, winRect.height);

  ex.restore();

  const link = document.createElement("a");
  link.download = "gallery-upload.png";
  link.href = exportCanvas.toDataURL("image/png");
  link.click();
};

/* ---------------- helper ---------------- */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
</script>

</body>
</html>
