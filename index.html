<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Composition Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#1f1d1b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  font-family:Arial,sans-serif;
  color:white;
  padding:20px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button,
select{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

button{
  cursor:pointer;
}

.frame{
  background:#f8f8f5;
  padding:40px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-width:100%;
}

.window{
  position:relative;
  width:min(90vw,900px);
  aspect-ratio:4/3;
  overflow:hidden;
  background:black;
  touch-action:none;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/*
  SAFARI FIX:
  video MUST remain renderable
*/
video{
  position:fixed;
  top:0;
  left:0;

  width:2px;
  height:2px;

  opacity:0.001;

  pointer-events:none;

  z-index:-1;
}
</style>
</head>
<body>

<div class="controls">

  <select id="ratio">
    <option value="4 / 3">4:3</option>
    <option value="1 / 1">1:1</option>
    <option value="16 / 9">16:9</option>
    <option value="9 / 16">9:16</option>
  </select>

  <button id="snap">
    Take Photo
  </button>

</div>

<div class="frame">

  <div class="window" id="window">

    <canvas id="canvas"></canvas>

  </div>

</div>

<video
  id="video"
  autoplay
  muted
  playsinline
  webkit-playsinline
></video>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const windowEl = document.getElementById("window");

let ready = false;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

/* -------------------------------- */
/* CANVAS SIZE                      */
/* -------------------------------- */

function resizeCanvas(){

  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}

window.addEventListener("resize", resizeCanvas);

/* -------------------------------- */
/* CAMERA                           */
/* -------------------------------- */

async function startCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{
            ideal:"environment"
          }
        }
      });

    video.srcObject = stream;

    /*
      IMPORTANT:
      Safari needs metadata FIRST
    */
    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
    });

    await video.play();

    /*
      Extra Safari stability delay
    */
    await new Promise(resolve =>
      setTimeout(resolve, 200)
    );

    resizeCanvas();

    ready = true;

    requestAnimationFrame(draw);

  }catch(err){

    console.error(err);

    alert(
      "Camera failed.\n\n" +
      "Make sure:\n" +
      "- You are using HTTPS\n" +
      "- Camera permission is allowed"
    );
  }
}

startCamera();

/* -------------------------------- */
/* DRAW LOOP                        */
/* -------------------------------- */

function draw(){

  requestAnimationFrame(draw);

  if(!ready) return;

  /*
    Safari readiness check
  */
  if(video.readyState < 2) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if(!vw || !vh) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const drawW = vw * scale;
  const drawH = vh * scale;

  const x =
    (canvas.width - drawW) / 2 + offsetX;

  const y =
    (canvas.height - drawH) / 2 + offsetY;

  ctx.drawImage(
    video,
    x,
    y,
    drawW,
    drawH
  );
}

/* -------------------------------- */
/* DRAG                             */
/* -------------------------------- */

let dragging = false;

let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", e => {

  dragging = true;

  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("pointerup", () => {

  dragging = false;
});

window.addEventListener("pointermove", e => {

  if(!dragging) return;

  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* -------------------------------- */
/* WHEEL ZOOM                       */
/* -------------------------------- */

canvas.addEventListener(
  "wheel",
  e => {

    e.preventDefault();

    scale += e.deltaY * -0.001;

    scale = Math.max(
      1,
      Math.min(5, scale)
    );
  },
  { passive:false }
);

/* -------------------------------- */
/* PINCH ZOOM                       */
/* -------------------------------- */

let lastDist = null;

canvas.addEventListener(
  "touchstart",
  e => {

    if(e.touches.length === 2){

      lastDist = getDist(e.touches);
    }
  },
  { passive:false }
);

canvas.addEventListener(
  "touchmove",
  e => {

    if(e.touches.length !== 2) return;

    e.preventDefault();

    const dist = getDist(e.touches);

    if(lastDist){

      scale *= dist / lastDist;

      scale = Math.max(
        1,
        Math.min(5, scale)
      );
    }

    lastDist = dist;
  },
  { passive:false }
);

canvas.addEventListener("touchend", () => {

  lastDist = null;
});

function getDist(touches){

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(dx*dx + dy*dy);
}

/* -------------------------------- */
/* ASPECT RATIO                     */
/* -------------------------------- */

document
  .getElementById("ratio")
  .addEventListener("change", e => {

    windowEl.style.aspectRatio =
      e.target.value;

    setTimeout(resizeCanvas, 50);
  });

/* -------------------------------- */
/* SNAPSHOT                         */
/* -------------------------------- */

document
  .getElementById("snap")
  .addEventListener("click", () => {

    const a = document.createElement("a");

    a.download = "composition.png";

    a.href =
      canvas.toDataURL("image/png");

    a.click();
  });
</script>

</body>
</html>
