<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit Gallery Camera</title>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 30% 20%, #f6f6f2, #e7e7e2);
  font-family:Arial,sans-serif;
}

.stage{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.wall{
  transform-origin:center;
}

.controls{
  position:fixed;
  top:20px;
  left:20px;
  z-index:10;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

.frame{
  background:#f7f7f4;
  padding:100px;
  border-radius:8px;
  box-shadow:0 60px 160px rgba(0,0,0,.20);
}

.window{
  position:relative;
  width:900px;
  aspect-ratio:4 / 3;
  background:#fff;
  border:18px solid #fdfdfc;
  box-shadow:0 25px 60px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.15);
  overflow:hidden;
}

.window::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:3;
  background:#fff;
  padding:55px;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.06),
    inset 0 18px 50px rgba(0,0,0,.12);
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

video{
  position:fixed;
  top:0;
  left:0;
  width:2px;
  height:2px;
  opacity:0.001;
}
</style>
</head>

<body>

<div class="controls">
  <button id="snap">Pause</button>
</div>

<div class="stage" id="stage">
  <div class="wall" id="wall">
    <div class="frame">
      <div class="window">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>

<script>
const wall = document.getElementById("wall");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const stage = document.getElementById("stage");

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let ready = false;
let isPaused = false;

/* ---------------- WALL FIT ---------------- */
function fitWall(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const baseWidth = 1200;
  const baseHeight = 900;

  const s = Math.min(vw / baseWidth, vh / baseHeight) * 0.95;
  wall.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitWall);
fitWall();

/* ---------------- CAMERA ---------------- */
async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" },
    audio:false
  });

  video.srcObject = stream;
  await video.play();

  resize();
  ready = true;
  requestAnimationFrame(draw);
}
startCamera();

/* ---------------- CANVAS ---------------- */
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resize);

/* ---------------- DRAW VIDEO ---------------- */
function draw(){
  requestAnimationFrame(draw);
  if(!ready || video.readyState < 2) return;
  if(isPaused) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const w = vw * scale;
  const h = vh * scale;

  const x = (canvas.width - w)/2 + offsetX;
  const y = (canvas.height - h)/2 + offsetY;

  ctx.drawImage(video, x, y, w, h);
}

/* ---------------- PAUSE / PLAY TOGGLE ---------------- */
document.getElementById("snap").onclick = () => {
  isPaused = !isPaused;
  document.getElementById("snap").textContent = isPaused ? "Play" : "Pause";
};

/* ---------------- interactions ---------------- */
let pointers = new Map();
let dragging = false;
let lx = 0, ly = 0;
let startDist = 0;
let startScale = 1;

function dist(a,b){
  return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
}

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);

  if(pointers.size === 1){
    dragging = true;
    lx = e.clientX;
    ly = e.clientY;
  }

  if(pointers.size === 2){
    const pts = [...pointers.values()];
    startDist = dist(pts[0], pts[1]);
    startScale = scale;
    dragging = false;
  }
});

canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);

  if(pointers.size === 2){
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);

    scale = startScale * (d / startDist);
    scale = Math.max(1, Math.min(5, scale));
    return;
  }

  if(!dragging) return;

  offsetX += e.clientX - lx;
  offsetY += e.clientY - ly;

  lx = e.clientX;
  ly = e.clientY;
});

function endPointer(e){
  pointers.delete(e.pointerId);
  dragging = false;
}

canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
</script>

</body>
</html>
