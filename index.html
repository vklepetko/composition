<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Wall Gallery Camera</title>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;

  /* 🧱 real wall feel (not pure white UI) */
  background: radial-gradient(circle at 30% 20%, #f6f6f2, #e7e7e2);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;

  font-family:Arial,sans-serif;
  padding:30px;
}

/* controls */
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button, select{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

/* 🧱 WALL DEPTH LAYER */
.frame{
  position:relative;
  padding:110px;

  /* soft wall shadow around frame area */
  background:rgba(255,255,255,0.25);

  border-radius:10px;

  /* makes it feel mounted on wall */
  box-shadow:
    inset 0 0 80px rgba(0,0,0,.08);
}

/* 🖼️ FRAME BODY (3D effect) */
.window{
  position:relative;
  width:min(90vw,900px);
  aspect-ratio:4 / 3;

  overflow:hidden;
  background:#fff;

  /* outer frame thickness illusion */
  border:18px solid #fdfdfc;

  /* depth from wall */
  box-shadow:
    0 25px 60px rgba(0,0,0,.25),
    0 6px 18px rgba(0,0,0,.15);

  transform: translateY(-2px);
}

/* 🧠 MAT LAYER (rectangular, clean cutout) */
.window::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:3;

  background:#ffffff;

  padding:55px;

  /* clean museum cutout */
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;

  /* depth inside frame */
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.06),
    inset 0 18px 50px rgba(0,0,0,.12);
}

/* 📸 IMAGE LAYER */
canvas{
  width:100%;
  height:100%;
  display:block;
  background:#fff;
  position:relative;
  z-index:1;
}

/* 📷 hidden camera */
video{
  position:fixed;
  top:0;
  left:0;
  width:2px;
  height:2px;
  opacity:0.001;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="controls">
  <select id="ratio">
    <option value="4 / 3">4:3</option>
    <option value="1 / 1">1:1</option>
    <option value="16 / 9">16:9</option>
    <option value="9 / 16">9:16</option>
    <option value="2 / 3">2:3</option>
  </select>

  <button id="snap">Take Photo</button>
</div>

<div class="frame">
  <div class="window" id="window">
    <canvas id="canvas"></canvas>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const windowEl = document.getElementById("window");

let ready = false;
let scale = 1;
let offsetX = 0;
let offsetY = 0;

/* resize */
function resizeCanvas(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resizeCanvas);

/* camera */
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ ideal:"environment" } }
    });

    video.srcObject = stream;

    await new Promise(r => video.onloadedmetadata = r);
    await video.play();

    await new Promise(r => setTimeout(r, 200));

    resizeCanvas();
    ready = true;

    requestAnimationFrame(draw);

  }catch(err){
    alert("Camera failed. Use HTTPS and allow permissions.");
  }
}
startCamera();

/* draw loop */
function draw(){
  requestAnimationFrame(draw);

  if(!ready) return;
  if(video.readyState < 2) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if(!vw || !vh) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const drawW = vw * scale;
  const drawH = vh * scale;

  const x = (canvas.width - drawW)/2 + offsetX;
  const y = (canvas.height - drawH)/2 + offsetY;

  ctx.drawImage(video, x, y, drawW, drawH);
}

/* drag */
let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", e=>{
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("pointerup", ()=>{
  dragging = false;
});

window.addEventListener("pointermove", e=>{
  if(!dragging) return;

  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* zoom */
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.max(1, Math.min(5, scale));
},{ passive:false });

/* aspect ratio */
document.getElementById("ratio")
.addEventListener("change", e=>{
  windowEl.style.aspectRatio = e.target.value;
  setTimeout(resizeCanvas, 50);
});

/* snapshot */
document.getElementById("snap")
.addEventListener("click", ()=>{
  const a = document.createElement("a");
  a.download = "gallery-photo.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});
</script>

</body>
</html>
